<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#718096;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1a202c" font-weight="bold">射频屏蔽箱 / RF Shielded Box</text>
  
  <!-- Main box body -->
  <rect x="50" y="80" width="300" height="180" rx="5" fill="url(#boxGrad)" stroke="#2d3748" stroke-width="2"/>
  
  <!-- Box lid (open) -->
  <path d="M 50 80 L 70 40 L 370 40 L 350 80 Z" fill="url(#lidGrad)" stroke="#2d3748" stroke-width="2"/>
  <rect x="70" y="40" width="280" height="5" fill="#718096"/>
  
  <!-- Internal shielding pattern -->
  <pattern id="shieldPattern" patternUnits="userSpaceOnUse" width="15" height="15">
    <line x1="0" y1="0" x2="15" y2="15" stroke="#5a6577" stroke-width="0.5"/>
    <line x1="15" y1="0" x2="0" y2="15" stroke="#5a6577" stroke-width="0.5"/>
  </pattern>
  <rect x="60" y="90" width="280" height="160" fill="url(#shieldPattern)" opacity="0.3"/>
  
  <!-- SDR device inside -->
  <rect x="120" y="150" width="80" height="50" rx="3" fill="#48bb78" stroke="#276749" stroke-width="2"/>
  <text x="160" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">SDR</text>
  
  <!-- Phone/UE inside -->
  <rect x="230" y="140" width="50" height="70" rx="5" fill="#4299e1" stroke="#2b6cb0" stroke-width="2"/>
  <rect x="235" y="145" width="40" height="55" fill="#63b3ed"/>
  <circle cx="255" cy="205" r="3" fill="#2b6cb0"/>
  <text x="255" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">UE</text>
  
  <!-- Signal waves (contained) -->
  <path d="M 200 175 Q 205 165 210 175" fill="none" stroke="#f6ad55" stroke-width="2" opacity="0.8"/>
  <path d="M 200 175 Q 208 160 216 175" fill="none" stroke="#f6ad55" stroke-width="2" opacity="0.6"/>
  <path d="M 200 175 Q 211 155 222 175" fill="none" stroke="#f6ad55" stroke-width="2" opacity="0.4"/>
  
  <!-- Feedthrough connectors -->
  <circle cx="80" cy="200" r="8" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  <circle cx="80" cy="200" r="4" fill="#a0aec0"/>
  <text x="80" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">电源</text>
  
  <circle cx="320" cy="200" r="8" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  <circle cx="320" cy="200" r="4" fill="#a0aec0"/>
  <text x="320" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">网线</text>
  
  <!-- X marks for blocked signals outside -->
  <g transform="translate(20, 120)">
    <line x1="0" y1="0" x2="15" y2="15" stroke="#e53e3e" stroke-width="3"/>
    <line x1="15" y1="0" x2="0" y2="15" stroke="#e53e3e" stroke-width="3"/>
  </g>
  <g transform="translate(365, 150)">
    <line x1="0" y1="0" x2="15" y2="15" stroke="#e53e3e" stroke-width="3"/>
    <line x1="15" y1="0" x2="0" y2="15" stroke="#e53e3e" stroke-width="3"/>
  </g>
  
  <!-- Labels -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">信号被限制在箱体内，不会干扰外部通信</text>
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#718096">Signals contained inside, no external interference</text>
</svg>
